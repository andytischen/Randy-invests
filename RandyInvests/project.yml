# XcodeGen project definition. Generate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
# then open RandyInvests.xcodeproj in Xcode and run the RandyInvests scheme.
name: RandyInvests
options:
  bundleIdPrefix: com.andytischen
  deploymentTarget:
    iOS: "17.0"
packages:
  RandyInvestsKit:
    path: .
targets:
  RandyInvests:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RandyInvestsKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Randy Invests
        # XcodeGen rewrites this plist on every generate, so the versions have to
        # live here or generation silently resets them to its 1.0 default.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andytischen.randyinvests
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
